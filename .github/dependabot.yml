version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
      - dependency-type: "all"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "security"
      - "dependencies"
    reviewers: []
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "America/Chicago"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "ci"
      - "dependencies"
